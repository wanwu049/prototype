<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>英圈刷题 - 登录页</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./nav.js" defer></script>
  </head>
  <body>
    <main class="stage">
      <section class="phone app" data-page="login" aria-label="WeChat Mini Program Prototype">
        <header class="topbar app-header">
          <div class="status">
            <div class="status-left">10:01</div>
            <div class="status-right">
              <span class="pill">5G</span>
              <span class="pill">90%</span>
            </div>
          </div>

          <div class="brand">
            <a class="back-btn" href="./welcome.html" aria-label="返回欢迎页">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
                <path
                  d="M15 6 9 12l6 6"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </a>
            <div class="brand-text">
              <div class="brand-title">登录</div>
              <div class="brand-subtitle">短信验证码 · 一键登录 · 密码登录</div>
            </div>
            <a class="icon-btn" href="./register.html" aria-label="去注册">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
                <path
                  d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"
                  stroke="currentColor"
                  stroke-width="1.6"
                />
                <path
                  d="M4 21a8 8 0 0 1 16 0"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linecap="round"
                />
              </svg>
            </a>
          </div>
        </header>

        <section class="content app-content" aria-label="页面内容">
          <article class="card">
            <div class="card-hd">
              <div class="card-title">手机号登录</div>
              <div class="tags"><span class="tag ghost">原型表单</span></div>
            </div>

            <div class="field">
              <div class="field-label">手机号</div>
              <input class="field-input" type="tel" placeholder="请输入手机号" />
            </div>
            <div class="field">
              <div class="field-label">验证码 / 密码</div>
              <input class="field-input" type="text" placeholder="短信验证码（或输入密码）" />
            </div>

            <div class="detail-cta" style="margin-top: 12px">
              <a class="mini-btn" href="./discover.html">登录进入</a>
              <a class="ghost-btn" href="./reset-password.html">忘记密码</a>
            </div>
          </article>

          <article class="card">
            <div class="card-hd">
              <div class="card-title">更多方式</div>
              <div class="tags"><span class="tag ghost">占位</span></div>
            </div>
            <div class="list">
              <a class="list-item" href="./discover.html">
                <div class="li-main">一键登录</div>
                <div class="li-sub">自动识别手机号并授权登录</div>
              </a>
              <a class="list-item" href="./discover.html">
                <div class="li-main">密码登录</div>
                <div class="li-sub">使用账号密码登录</div>
              </a>
            </div>
          </article>
        </section>

        <footer class="nav app-footer" aria-label="底部导航">
          <a class="nav-item" href="./discover.html">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>首页</span>
          </a>
          <a class="nav-item" href="./practice-home.html">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>刷题</span>
          </a>
          <a class="nav-item" href="./community.html">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>社区</span>
          </a>
          <a class="nav-item" href="./mall.html">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>商城</span>
          </a>
          <a class="nav-item" href="./me.html">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>我的</span>
          </a>
        </footer>
      </section>
    </main>
  </body>
</html>
