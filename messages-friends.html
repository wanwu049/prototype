<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>英圈刷题 - 消息-好友</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./nav.js" defer></script>
  </head>
  <body>
    <main class="stage">
      <section class="phone app" data-page="messages-friends" aria-label="WeChat Mini Program Prototype">
        <header class="topbar app-header">
          <div class="status">
            <div class="status-left">10:01</div>
            <div class="status-right">
              <span class="pill">5G</span>
              <span class="pill">90%</span>
            </div>
          </div>

          <div class="brand">
            <a class="back-btn" href="./messages.html" aria-label="返回消息中心">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
                <path
                  d="M15 6 9 12l6 6"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </a>
            <div class="brand-text">
              <div class="brand-title">好友消息</div>
              <div class="brand-subtitle">一起追好内容 · 与好友聊天</div>
            </div>
            <a class="icon-btn" href="./search.html" aria-label="搜索用户">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
                <path d="M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15Z" stroke="currentColor" stroke-width="1.6" />
                <path d="M16.5 16.5 21 21" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
              </svg>
            </a>
          </div>
        </header>

        <section class="content app-content" aria-label="页面内容">
          <article class="card">
            <div class="card-hd">
              <div class="card-title">最近聊天</div>
              <div class="tags"><span class="tag ghost">可点进详情（占位）</span></div>
            </div>
            <div class="list">
              <a class="list-item" href="./messages-friends.html">
                <div class="li-main">考研搭子小北</div>
                <div class="li-sub">你：这套阅读我错了 3 个…（2 未读）</div>
              </a>
              <a class="list-item" href="./messages-friends.html">
                <div class="li-main">写作老师Luna</div>
                <div class="li-sub">Luna：我给你改了开头段，重点看结构</div>
              </a>
              <a class="list-item" href="./messages-friends.html">
                <div class="li-main">四级冲刺群</div>
                <div class="li-sub">群公告：本周末模考，记得打卡</div>
              </a>
            </div>
          </article>

          <article class="card">
            <div class="card-hd">
              <div class="card-title">好友管理</div>
              <div class="tags"><span class="tag ghost">占位</span></div>
            </div>
            <div class="list">
              <a class="list-item" href="./following.html">
                <div class="li-main">查看关注列表</div>
                <div class="li-sub">管理社交关系与学习伙伴</div>
              </a>
              <a class="list-item" href="./me.html">
                <div class="li-main">去我的主页</div>
                <div class="li-sub">收藏/帖子/学习档案等入口</div>
              </a>
            </div>
          </article>
        </section>

        <footer class="nav app-footer" aria-label="底部导航">
          <a class="nav-item" href="./discover.html">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>首页</span>
          </a>
          <a class="nav-item" href="./practice-home.html">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>刷题</span>
          </a>
          <a class="nav-item" href="./community.html">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>社区</span>
          </a>
          <a class="nav-item" href="./mall.html">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>商城</span>
          </a>
          <a class="nav-item" href="./me.html">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>我的</span>
          </a>
        </footer>
      </section>
    </main>
  </body>
</html>
