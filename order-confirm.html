<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>英圈刷题 - 订单确认页（交易服务）</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./nav.js" defer></script>
  </head>
  <body>
    <main class="stage">
      <section class="phone app" data-page="order-confirm" aria-label="WeChat Mini Program Prototype">
        <header class="topbar app-header">
          <div class="status">
            <div class="status-left">10:01</div>
            <div class="status-right"><span class="pill">5G</span><span class="pill">90%</span></div>
          </div>
          <div class="brand">
            <a class="back-btn" href="./cart.html" aria-label="返回购物车">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
                <path d="M15 6 9 12l6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </a>
            <div class="brand-text">
              <div class="brand-title">订单确认</div>
              <div class="brand-subtitle">确认信息 · 选择支付方式 · 提交订单</div>
            </div>
            <span style="width:40px"></span>
          </div>
        </header>

        <section class="content app-content" aria-label="页面内容">
          <article class="card">
            <div class="card-hd">
              <div class="card-title">购买信息</div>
              <div class="tags"><span class="tag ghost">数字内容</span></div>
            </div>
            <div class="list">
              <a class="list-item" href="./product-detail.html">
                <div class="thumb" aria-hidden="true"></div>
                <div class="li-text">
                  <div class="li-main">四级阅读技巧课（4讲）</div>
                  <div class="li-sub">课程 · 可回放 · 180 天</div>
                </div>
                <div class="li-right"><span class="badge red">¥19.9</span><span class="badge">x1</span></div>
              </a>
              <a class="list-item" href="./vip-center.html">
                <div class="thumb" aria-hidden="true" style="background:linear-gradient(135deg, rgba(124,58,237,.65), rgba(47,214,255,.42));"></div>
                <div class="li-text">
                  <div class="li-main">英圈会员（月卡）</div>
                  <div class="li-sub">AI 批改不限次 · 专属题单</div>
                </div>
                <div class="li-right"><span class="badge red">¥29.9</span><span class="badge">x1</span></div>
              </a>
            </div>
          </article>

          <article class="card">
            <div class="card-hd">
              <div class="card-title">优惠与备注</div>
              <div class="tags"><span class="tag ghost">可选</span></div>
            </div>
            <div class="kv">
              <div class="k">优惠券</div>
              <div class="v"><a class="link" href="./coupons.html">满 49 减 5（已选）</a></div>
              <div class="k">备注</div>
              <div class="v">无</div>
            </div>
            <div class="divider"></div>
            <div class="card-hd">
              <div class="card-title">支付方式</div>
              <div class="tags"><span class="tag ghost">第三方支付</span></div>
            </div>
            <div class="chip-grid">
              <a class="chip2 active" href="#">微信支付</a>
              <a class="chip2" href="#">支付宝</a>
              <a class="chip2" href="#">余额/会员抵扣</a>
            </div>
          </article>

          <article class="card">
            <div class="card-hd">
              <div class="card-title">费用明细</div>
              <div class="tags"><span class="tag ghost">以实际支付为准</span></div>
            </div>
            <div class="kv">
              <div class="k">商品金额</div>
              <div class="v">¥49.8</div>
              <div class="k">优惠券</div>
              <div class="v">- ¥5.0</div>
              <div class="k">应付</div>
              <div class="v"><span class="price red">¥44.8</span></div>
            </div>
            <div class="divider"></div>
            <div class="row">
              <a class="mini-btn" href="./cart.html">返回修改</a>
              <a class="mini-btn primary" href="./pay.html">提交订单</a>
            </div>
          </article>
        </section>

        <footer class="nav app-footer" aria-label="底部导航">
          <a class="nav-item" href="./discover.html"><span class="nav-ic" aria-hidden="true"></span><span>首页</span></a>
          <a class="nav-item" href="./practice-home.html"><span class="nav-ic" aria-hidden="true"></span><span>刷题</span></a>
          <a class="nav-item" href="./community.html"><span class="nav-ic" aria-hidden="true"></span><span>社区</span></a>
          <a class="nav-item active" href="./mall.html"><span class="nav-ic" aria-hidden="true"></span><span>商城</span></a>
          <a class="nav-item" href="./me.html"><span class="nav-ic" aria-hidden="true"></span><span>我的</span></a>
        </footer>
      </section>
    </main>
  </body>
</html>
