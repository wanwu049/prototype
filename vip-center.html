<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>英圈刷题 - 会员中心页（交易服务）</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./nav.js" defer></script>
  </head>
  <body>
    <main class="stage">
      <section class="phone app" data-page="vip-center" aria-label="WeChat Mini Program Prototype">
        <header class="topbar app-header">
          <div class="status">
            <div class="status-left">10:01</div>
            <div class="status-right"><span class="pill">5G</span><span class="pill">90%</span></div>
          </div>
          <div class="brand">
            <a class="back-btn" href="./mall.html" aria-label="返回商城">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
                <path d="M15 6 9 12l6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </a>
            <div class="brand-text">
              <div class="brand-title">会员中心</div>
              <div class="brand-subtitle">权益/开通/续费 · 有效期</div>
            </div>
            <a class="icon-btn" href="./coupons.html" aria-label="优惠券">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
                <path
                  d="M4 8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4V8Z"
                  stroke="currentColor"
                  stroke-width="1.6"
                />
              </svg>
            </a>
          </div>
        </header>

        <section class="content app-content" aria-label="页面内容">
          <article class="hero">
            <div class="hero-bg" aria-hidden="true"></div>
            <div class="hero-body">
              <div class="row">
                <div>
                  <div class="hero-title">英圈会员</div>
                  <div class="hero-subtitle">AI 批改不限次 · 专属题单 · 资料下载</div>
                </div>
                <span class="pill2 blue">未开通</span>
              </div>
              <div style="margin-top:12px; display:flex; gap:10px; flex-wrap:wrap;">
                <a class="mini-btn primary" href="./order-confirm.html">开通月卡 ¥29.9</a>
                <a class="mini-btn" href="./order-confirm.html">季卡 ¥79.0</a>
              </div>
            </div>
          </article>

          <div class="section-hd">
            <div class="section-title">会员权益</div>
            <div class="section-sub">开通后立即生效</div>
          </div>
          <section class="stats" aria-label="权益概览">
            <div class="stat kpi">
              <div class="stat-num">∞</div>
              <div class="stat-lab">AI 批改</div>
              <div class="stat-mini">不限次</div>
            </div>
            <div class="stat">
              <div class="stat-num">专属</div>
              <div class="stat-lab">题单</div>
              <div class="stat-mini">按薄弱点</div>
            </div>
            <div class="stat">
              <div class="stat-num">资料</div>
              <div class="stat-lab">下载</div>
              <div class="stat-mini">词汇/模板</div>
            </div>
          </section>

          <article class="card">
            <div class="card-hd">
              <div class="card-title">适合人群</div>
              <div class="tags"><span class="tag ghost">推荐</span></div>
            </div>
            <div class="para">
              - 想快速提分：需要高频练习 + 即时批改<br />
              - 备考冲刺：需要限时模考 + 错题复盘闭环<br />
              - 自律学习：需要计划与打卡驱动
            </div>
            <div class="row" style="margin-top:12px">
              <a class="mini-btn" href="./practice-diagnosis-report.html">先看诊断报告</a>
              <a class="mini-btn primary" href="./order-confirm.html">立即开通</a>
            </div>
          </article>
        </section>

        <footer class="nav app-footer" aria-label="底部导航">
          <a class="nav-item" href="./discover.html"><span class="nav-ic" aria-hidden="true"></span><span>首页</span></a>
          <a class="nav-item" href="./practice-home.html"><span class="nav-ic" aria-hidden="true"></span><span>刷题</span></a>
          <a class="nav-item" href="./community.html"><span class="nav-ic" aria-hidden="true"></span><span>社区</span></a>
          <a class="nav-item active" href="./mall.html"><span class="nav-ic" aria-hidden="true"></span><span>商城</span></a>
          <a class="nav-item" href="./me.html"><span class="nav-ic" aria-hidden="true"></span><span>我的</span></a>
        </footer>
      </section>
    </main>
  </body>
</html>
