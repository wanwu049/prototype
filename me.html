<!doctype html>
<html lang="zh-CN">

    <link rel="stylesheet" href="./styles.css" />

  <body>
    <main class="stage">
      <section class="phone app" data-page="me" aria-label="WeChat Mini Program Prototype">
        <header class="topbar app-header">
          <div class="status">
            <div class="status-left">10:01</div>
            <div class="status-right">
              <span class="pill">5G</span>
              <span class="pill">90%</span>
            </div>
          </div>

          <div class="brand">
            <a class="back-btn" href="./discover.html" aria-label="返回首页">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
                <path
                  d="M15 6 9 12l6 6"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </a>
            <div class="brand-text">
              <div class="brand-title">我的</div>
              <div class="brand-subtitle">账户管理 · 学习档案 · 订单与设置</div>
            </div>
            <a class="icon-btn" href="./settings.html" aria-label="设置">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
                <path
                  d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z"
                  stroke="currentColor"
                  stroke-width="1.6"
                />
                <path
                  d="M19.4 12a7.4 7.4 0 0 0-.1-1.2l2-1.5-2-3.4-2.4 1a7.7 7.7 0 0 0-2-1.2l-.4-2.6H9.5l-.4 2.6a7.7 7.7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.5A7.4 7.4 0 0 0 4.6 12c0 .4 0 .8.1 1.2l-2 1.5 2 3.4 2.4-1a7.7 7.7 0 0 0 2 1.2l.4 2.6h4.9l.4-2.6a7.7 7.7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.5c.1-.4.1-.8.1-1.2Z"
                  stroke="currentColor"
                  stroke-width="1.2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  opacity=".9"
                />
              </svg>
            </a>
          </div>
        </header>

        <section class="content app-content" aria-label="页面内容">
          <article class="card">
            <div class="feed-hd">
              <div class="avatar sm" aria-hidden="true"></div>
              <div class="feed-meta">
                <div class="feed-name">学习者 13157</div>
                <div class="feed-sub">目标：CET-4 550 · 连续学习 6 天</div>
              </div>
              <a class="mini-btn" href="./profile-edit.html">编辑</a>
            </div>
            <div class="bar" aria-hidden="true" style="margin-top: 12px">
              <span style="width: 62%"></span>
            </div>
            <div class="meta-sub" style="margin-top: 8px">本周完成度 62% · 去完善学习档案提升推荐准确度</div>
          </article>

          <article class="card">
            <div class="card-hd">
              <div class="card-title">快捷入口</div>
              <div class="tags"><span class="tag ghost">账户管理</span></div>
            </div>
            <div class="actions" style="grid-template-columns: repeat(4, 1fr)">
              <a class="action" href="./favorites.html" aria-label="我的收藏">
                <span class="action-ic" aria-hidden="true"></span>
                <span class="action-txt">收藏</span>
              </a>
              <a class="action" href="./my-posts.html" aria-label="我的帖子">
                <span class="action-ic" aria-hidden="true"></span>
                <span class="action-txt">帖子</span>
              </a>
              <a class="action" href="./my-learning.html" aria-label="我的学习档案">
                <span class="action-ic" aria-hidden="true"></span>
                <span class="action-txt">学习档案</span>
              </a>
              <a class="action" href="./vip.html" aria-label="会员中心">
                <span class="action-ic" aria-hidden="true"></span>
                <span class="action-txt">会员</span>
              </a>
            </div>
          </article>

          <article class="card">
            <div class="card-hd">
              <div class="card-title">账户管理</div>
              <div class="tags"><span class="tag ghost">更多功能</span></div>
            </div>
            <div class="list">
              <a class="list-item" href="./orders.html">
                <div class="li-main">我的订单</div>
                <div class="li-sub">套卷/课程/会员购买与发票</div>
              </a>
              <a class="list-item" href="./settings.html">
                <div class="li-main">设置页</div>
                <div class="li-sub">通知、隐私、缓存、关于我们等</div>
              </a>
              <a class="list-item" href="./help.html">
                <div class="li-main">帮助与反馈页</div>
                <div class="li-sub">常见问题、在线客服、问题反馈</div>
              </a>
            </div>
          </article>
        </section>

        <footer class="nav app-footer" aria-label="底部导航">
          <a class="nav-item" href="./discover.html">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>首页</span>
          </a>
          <a class="nav-item" href="./practice-home.html">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>刷题</span>
          </a>
          <a class="nav-item" href="./community.html">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>社区</span>
          </a>
          <a class="nav-item" href="./mall.html">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>商城</span>
          </a>
          <a class="nav-item active" href="./me.html" aria-current="page">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>我的</span>
          </a>
        </footer>
