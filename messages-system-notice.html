<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>英圈刷题 - 消息-系统通知</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./nav.js" defer></script>
  </head>
  <body>
    <main class="stage">
      <section class="phone app" data-page="messages-system-notice" aria-label="WeChat Mini Program Prototype">
        <header class="topbar app-header">
          <div class="status">
            <div class="status-left">10:01</div>
            <div class="status-right">
              <span class="pill">5G</span>
              <span class="pill">90%</span>
            </div>
          </div>

          <div class="brand">
            <a class="back-btn" href="./messages.html" aria-label="返回消息中心">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
                <path
                  d="M15 6 9 12l6 6"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </a>
            <div class="brand-text">
              <div class="brand-title">系统通知</div>
              <div class="brand-subtitle">公告 · 活动提醒 · 处理告警</div>
            </div>
            <a class="icon-btn" href="./settings.html" aria-label="通知设置">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
                <path
                  d="M7.5 9.5c0-2.761 2.015-5 4.5-5s4.5 2.239 4.5 5v3.3l1.1 1.4c.6.8.05 1.8-.95 1.8H7.85c-1 0-1.55-1-.95-1.8l1.1-1.4V9.5Z"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <path
                  d="M10 18.2c.3 1.1 1.1 1.8 2 1.8s1.7-.7 2-1.8"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linecap="round"
                />
              </svg>
            </a>
          </div>
        </header>

        <section class="content app-content" aria-label="页面内容">
          <article class="card">
            <div class="card-hd">
              <div class="card-title">重要提醒</div>
              <div class="tags"><span class="tag">未读 2</span><span class="tag ghost">置顶</span></div>
            </div>
            <div class="list">
              <a class="list-item" href="./practice-home.html">
                <div class="li-main">模考开始：CET-4 周末限时套卷</div>
                <div class="li-sub">18:00-22:00 · 进入刷题完成并领取报告</div>
              </a>
              <a class="list-item" href="./my-learning.html">
                <div class="li-main">学习报告已生成</div>
                <div class="li-sub">本周薄弱点：词汇搭配、长难句主干定位</div>
              </a>
            </div>
          </article>

          <article class="card">
            <div class="card-hd">
              <div class="card-title">平台公告</div>
              <div class="tags"><span class="tag ghost">更新</span></div>
            </div>
            <div class="list">
              <a class="list-item" href="./settings.html">
                <div class="li-main">隐私政策更新</div>
                <div class="li-sub">新增学习数据导出与删除入口</div>
              </a>
              <a class="list-item" href="./vip.html">
                <div class="li-main">会员权益升级</div>
                <div class="li-sub">新增 AI 口语陪练题库与批改次数</div>
              </a>
            </div>
          </article>

          <article class="card">
            <div class="card-hd">
              <div class="card-title">处理告警（占位）</div>
              <div class="tags"><span class="tag ghost">运营/风控</span></div>
            </div>
            <div class="callout">示例：你的昵称/头像疑似违规，需在 24 小时内修改，否则将限制发帖。</div>
            <div class="detail-cta">
              <a class="mini-btn" href="./profile-edit.html">去修改资料</a>
              <a class="ghost-btn danger" href="./help.html">申诉</a>
            </div>
          </article>
        </section>

        <footer class="nav app-footer" aria-label="底部导航">
          <a class="nav-item" href="./discover.html">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>首页</span>
          </a>
          <a class="nav-item" href="./practice-home.html">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>刷题</span>
          </a>
          <a class="nav-item" href="./community.html">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>社区</span>
          </a>
          <a class="nav-item" href="./mall.html">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>商城</span>
          </a>
          <a class="nav-item" href="./me.html">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>我的</span>
          </a>
        </footer>
      </section>
    </main>
  </body>
</html>
