<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>英圈刷题 - 欢迎页</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="stage">
      <section class="phone app" data-page="welcome" aria-label="WeChat Mini Program Prototype">
        <header class="topbar app-header">
          <div class="status">
            <div class="status-left">10:01</div>
            <div class="status-right">
              <span class="pill">5G</span>
              <span class="pill">90%</span>
            </div>
          </div>

          <div class="brand">
            <div class="logo" aria-hidden="true"></div>
            <div class="brand-text">
              <div class="brand-title">欢迎使用</div>
              <div class="brand-subtitle">英圈刷题 APP 的欢迎页面</div>
            </div>
            <a class="icon-btn" href="./login.html" aria-label="去登录">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
                <path
                  d="M10 7h9a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2h-9"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <path
                  d="M13 12H3m0 0 3-3M3 12l3 3"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </a>
          </div>
        </header>

        <section class="content app-content" aria-label="页面内容">
          <article class="hero">
            <div class="hero-bg" aria-hidden="true"></div>
            <div class="hero-body">
              <div class="hero-title">英圈刷题</div>
              <div class="hero-subtitle">AI 提分 · UGC 共创 · 语伴陪练</div>
              <a class="cta wide" href="./login.html">登录 / 注册</a>
            </div>
          </article>

          <article class="card">
            <div class="card-hd">
              <div class="card-title">快速入口</div>
              <div class="tags"><span class="tag ghost">原型跳转</span></div>
            </div>
            <div class="list">
              <a class="list-item" href="./login.html">
                <div class="li-main">登录页</div>
                <div class="li-sub">短信验证码登录 · 一键登录 · 密码登录</div>
              </a>
              <a class="list-item" href="./register.html">
                <div class="li-main">注册页</div>
                <div class="li-sub">手机注册 · 填写信息 · 完成实名认证</div>
              </a>
              <a class="list-item" href="./reset-password.html">
                <div class="li-main">忘记密码</div>
                <div class="li-sub">找回账号与重置密码</div>
              </a>
            </div>
          </article>
        </section>

        <footer class="nav app-footer" aria-label="底部导航">
          <a class="nav-item" href="./discover.html">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>首页</span>
          </a>
          <a class="nav-item" href="./practice-home.html">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>刷题</span>
          </a>
          <a class="nav-item" href="./community.html">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>社区</span>
          </a>
          <a class="nav-item" href="./mall.html">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>商城</span>
          </a>
          <a class="nav-item" href="./me.html">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>我的</span>
          </a>
        </footer>
      </section>
    </main>
  </body>
</html>
