<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>英圈刷题 - 评论页（首页推荐）</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./nav.js" defer></script>
  </head>
  <body>
    <main class="stage">
      <section class="phone app" data-page="comments" aria-label="WeChat Mini Program Prototype">
        <header class="topbar app-header">
          <div class="status">
            <div class="status-left">10:01</div>
            <div class="status-right">
              <span class="pill">5G</span>
              <span class="pill">90%</span>
            </div>
          </div>
          <div class="brand">
            <a class="back-btn" href="./detail.html" aria-label="返回内容详情">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
                <path
                  d="M15 6 9 12l6 6"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </a>
            <div class="brand-text">
              <div class="brand-title">评论</div>
              <div class="brand-subtitle">发布 · 互动 · 点赞</div>
            </div>
            <span style="width:40px"></span>
          </div>
        </header>

        <section class="content app-content" aria-label="页面内容">
          <article class="card">
            <div class="card-hd">
              <div class="card-title">内容摘要</div>
              <div class="tags"><span class="tag ghost">可返回详情</span></div>
            </div>
            <div class="meta-main">
              <a class="link" href="./detail.html">高频词汇记忆法：用场景拆分背更快</a>
            </div>
            <div class="meta-sub">共 128 条评论</div>
          </article>

          <div class="section-hd" aria-label="发表评论">
            <div class="section-title">发表评论</div>
            <div class="section-sub">文明交流 · 共同进步</div>
          </div>
          <article class="card">
            <div class="comment composer">
              <div class="avatar sm" aria-hidden="true"></div>
              <div class="composer-box">
                <input class="field-input" type="text" placeholder="写下你的想法…" />
                <div class="composer-actions">
                  <a class="ghost-btn" href="#">@好友</a>
                  <a class="ghost-btn" href="#">表情</a>
                  <a class="mini-btn primary" href="#">发布</a>
                </div>
              </div>
            </div>
          </article>

          <div class="section-hd" aria-label="评论列表标题">
            <div class="section-title">热门评论</div>
            <div class="section-sub">按热度排序</div>
          </div>
          <section class="cards" aria-label="评论列表">
            <article class="card">
              <div class="comment">
                <div class="avatar sm" aria-hidden="true"></div>
                <div class="c-body">
                  <div class="c-top">
                    <span class="c-name">小橙</span>
                    <span class="c-time">1 小时前</span>
                  </div>
                  <div class="c-text">这个“场景拆分”太好用了，我把校园/职场分开背，写作替换词明显多了。</div>
                  <div class="c-actions">
                    <a class="ghost-btn" href="#">回复</a>
                    <a class="ghost-btn" href="#">点赞 36</a>
                    <a class="ghost-btn danger" href="#">删除</a>
                  </div>
                </div>
              </div>
            </article>

            <article class="card">
              <div class="comment">
                <div class="avatar sm" aria-hidden="true"></div>
                <div class="c-body">
                  <div class="c-top">
                    <span class="c-name">晨光</span>
                    <span class="c-time">昨天</span>
                  </div>
                  <div class="c-text">能不能再出一篇长难句的“场景复述”示例？</div>
                  <div class="c-actions">
                    <a class="ghost-btn" href="#">回复</a>
                    <a class="ghost-btn" href="#">点赞 12</a>
                  </div>
                </div>
              </div>
            </article>
          </section>
        </section>

        <footer class="nav app-footer" aria-label="底部导航">
          <a class="nav-item active" href="./discover.html">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>首页</span>
          </a>
          <a class="nav-item" href="./practice-home.html">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>刷题</span>
          </a>
          <a class="nav-item" href="./community.html">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>社区</span>
          </a>
          <a class="nav-item" href="./mall.html">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>商城</span>
          </a>
          <a class="nav-item" href="./me.html">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>我的</span>
          </a>
        </footer>
      </section>
    </main>
  </body>
</html>
