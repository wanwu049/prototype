<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>英圈刷题 - 优惠券页（交易服务）</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./nav.js" defer></script>
  </head>
  <body>
    <main class="stage">
      <section class="phone app" data-page="coupons" aria-label="WeChat Mini Program Prototype">
        <header class="topbar app-header">
          <div class="status">
            <div class="status-left">10:01</div>
            <div class="status-right"><span class="pill">5G</span><span class="pill">90%</span></div>
          </div>
          <div class="brand">
            <a class="back-btn" href="./mall.html" aria-label="返回商城">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
                <path d="M15 6 9 12l6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </a>
            <div class="brand-text">
              <div class="brand-title">优惠券</div>
              <div class="brand-subtitle">查看/领取/使用</div>
            </div>
            <span style="width:40px"></span>
          </div>

          <div class="filters" aria-label="券筛选">
            <a class="chip2 active" href="#">可用</a>
            <a class="chip2" href="#">已用</a>
            <a class="chip2" href="#">已过期</a>
            <a class="chip2" href="#">去领取</a>
          </div>
        </header>

        <section class="content app-content" aria-label="页面内容">
          <article class="card">
            <div class="card-hd">
              <div class="card-title">可用优惠券（2）</div>
              <div class="tags"><span class="tag ghost">结算自动抵扣</span></div>
            </div>
            <div class="list">
              <a class="list-item" href="./order-confirm.html">
                <div class="thumb" aria-hidden="true" style="background:linear-gradient(135deg, rgba(255,77,109,.55), rgba(47,214,255,.42));"></div>
                <div class="li-text">
                  <div class="li-main">满 49 减 5</div>
                  <div class="li-sub">适用：课程/会员/套卷 · 有效期 7 天</div>
                </div>
                <div class="li-right"><span class="badge red">-¥5</span><span class="badge green">去用</span></div>
              </a>
              <a class="list-item" href="./order-confirm.html">
                <div class="thumb" aria-hidden="true" style="background:linear-gradient(135deg, rgba(245,158,11,.55), rgba(47,214,255,.42));"></div>
                <div class="li-text">
                  <div class="li-main">新客立减</div>
                  <div class="li-sub">适用：首单 · 有效期 3 天</div>
                </div>
                <div class="li-right"><span class="badge orange">-¥3</span><span class="badge">去用</span></div>
              </a>
            </div>
          </article>

          <article class="card">
            <div class="card-hd">
              <div class="card-title">领券中心（占位）</div>
              <div class="tags"><span class="tag ghost">更多优惠</span></div>
            </div>
            <div class="chip-grid">
              <a class="chip2 active" href="#">会员专享券</a>
              <a class="chip2" href="#">套卷满减</a>
              <a class="chip2" href="#">1v1 服务券</a>
            </div>
            <div class="row" style="margin-top:12px">
              <a class="mini-btn" href="./mall.html">去逛商城</a>
              <a class="mini-btn primary" href="./order-confirm.html">去结算</a>
            </div>
          </article>
        </section>

        <footer class="nav app-footer" aria-label="底部导航">
          <a class="nav-item" href="./discover.html"><span class="nav-ic" aria-hidden="true"></span><span>首页</span></a>
          <a class="nav-item" href="./practice-home.html"><span class="nav-ic" aria-hidden="true"></span><span>刷题</span></a>
          <a class="nav-item" href="./community.html"><span class="nav-ic" aria-hidden="true"></span><span>社区</span></a>
          <a class="nav-item active" href="./mall.html"><span class="nav-ic" aria-hidden="true"></span><span>商城</span></a>
          <a class="nav-item" href="./me.html"><span class="nav-ic" aria-hidden="true"></span><span>我的</span></a>
        </footer>
      </section>
    </main>
  </body>
</html>
