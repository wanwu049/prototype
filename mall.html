          <div class="brand">
            <a class="back-btn" href="./discover.html" aria-label="返回首页">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
                <path d="M15 6 9 12l6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
              </svg>

            <div class="brand-text">
              <div class="brand-title">商城</div>
              <div class="brand-subtitle">课程 · 会员 · 套卷 · 1v1 服务</div>
            </div>
            <a class="icon-btn" href="./cart.html" aria-label="购物车">

                <path d="M6 7h15l-2 8H7L6 7Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />

              </svg>

          </div>

          <div class="search-wrap">
            <a class="search search-link" href="./search.html" aria-label="搜索商品/课程">
              <svg class="search-ic" viewBox="0 0 24 24" width="18" height="18" fill="none">
                <path d="M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15Z" stroke="currentColor" stroke-width="1.6" />
                <path d="M16.5 16.5 21 21" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
              </svg>
              <span class="search-placeholder">搜索课程/会员/套卷/1v1</span>
            </a>
          </div>
        </header>

        <section class="content app-content" aria-label="页面内容">
          <article class="hero">
            <div class="hero-bg" aria-hidden="true"></div>
            <div class="hero-body">
              <div class="hero-title">会员限时特惠</div>

          <section class="panel" aria-label="商品分类">

            <div class="chip-grid">

          <div class="section-hd">

            <div class="section-sub">人气商品</div>
          </div>
          <article class="card">
            <div class="list">

              <a class="list-item" href="./product-detail.html">

              <a class="list-item" href="./product-detail.html">
                <div class="thumb" aria-hidden="true" style="background:linear-gradient(135deg, rgba(245,158,11,.55), rgba(47,214,255,.42));"></div>
                <div class="li-text">
                  <div class="li-main">四级冲刺套卷（5套）</div>
                  <div class="li-sub">含解析 · 限时模考</div>
                </div>
                <div class="li-right">
                  <span class="badge orange">套卷</span>
                  <span class="badge red">¥9.9</span>
                </div>
              </a>
            </div>

          <div class="section-hd">
            <div class="section-title">服务推荐</div>
            <div class="section-sub">高客单提效</div>
          </div>
          <article class="card">
            <div class="list">
              <a class="list-item" href="./product-detail.html">
                <div class="thumb" aria-hidden="true" style="background:linear-gradient(135deg, rgba(16,185,129,.55), rgba(47,214,255,.42));"></div>
                <div class="li-text">
                  <div class="li-main">1v1 写作精批（30分钟）</div>

        <footer class="nav app-footer" aria-label="底部导航">
          <a class="nav-item" href="./discover.html"><span class="nav-ic" aria-hidden="true"></span><span>首页</span></a>
          <a class="nav-item" href="./practice-home.html"><span class="nav-ic" aria-hidden="true"></span><span>刷题</span></a>
