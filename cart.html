<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>英圈刷题 - 购物车页（交易服务）</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./nav.js" defer></script>
  </head>
  <body>
    <main class="stage">
      <section class="phone app" data-page="cart" aria-label="WeChat Mini Program Prototype">
        <header class="topbar app-header">
          <div class="status">
            <div class="status-left">10:01</div>
            <div class="status-right"><span class="pill">5G</span><span class="pill">90%</span></div>
          </div>
          <div class="brand">
            <a class="back-btn" href="./mall.html" aria-label="返回商城">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
                <path d="M15 6 9 12l6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </a>
            <div class="brand-text">
              <div class="brand-title">购物车</div>
              <div class="brand-subtitle">批量结算 · 删除 · 使用优惠券</div>
            </div>
            <a class="icon-btn" href="./coupons.html" aria-label="优惠券">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
                <path
                  d="M4 8a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4V8Z"
                  stroke="currentColor"
                  stroke-width="1.6"
                />
                <path d="M9 9h.01M9 15h.01" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
                <path d="M14.5 9.5 9.5 14.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
              </svg>
            </a>
          </div>
        </header>

        <section class="content app-content" aria-label="页面内容">
          <article class="card">
            <div class="card-hd">
              <div class="card-title">已选商品（2）</div>
              <div class="tags"><span class="tag ghost">可多选</span></div>
            </div>

            <div class="cart-item" aria-label="商品1">
              <div class="check" aria-hidden="true" style="background:linear-gradient(135deg, rgba(30,107,255,.95), rgba(47,214,255,.82)); border-color:transparent"></div>
              <div class="thumb2" aria-hidden="true"></div>
              <div>
                <div class="cart-title">四级阅读技巧课（4讲）</div>
                <div class="cart-sub">课程 · 可回放 · 180 天</div>
              </div>
              <div>
                <div class="price red">¥19.9</div>
                <div class="qty" aria-label="数量选择">
                  <a class="qty-btn" href="#">-</a>
                  <span class="qty-num">1</span>
                  <a class="qty-btn" href="#">+</a>
                </div>
              </div>
            </div>

            <div class="divider"></div>

            <div class="cart-item" aria-label="商品2">
              <div class="check" aria-hidden="true" style="background:linear-gradient(135deg, rgba(30,107,255,.95), rgba(47,214,255,.82)); border-color:transparent"></div>
              <div class="thumb2" aria-hidden="true" style="background:linear-gradient(135deg, rgba(124,58,237,.65), rgba(47,214,255,.42));"></div>
              <div>
                <div class="cart-title">英圈会员（月卡）</div>
                <div class="cart-sub">AI 批改不限次 · 专属题单</div>
              </div>
              <div>
                <div class="price red">¥29.9</div>
                <div class="qty" aria-label="数量选择">
                  <a class="qty-btn" href="#">-</a>
                  <span class="qty-num">1</span>
                  <a class="qty-btn" href="#">+</a>
                </div>
              </div>
            </div>

            <div class="divider"></div>
            <div class="kv">
              <div class="k">商品金额</div>
              <div class="v"><span class="price">¥49.8</span></div>
              <div class="k">优惠券</div>
              <div class="v">- ¥5.0</div>
              <div class="k">合计</div>
              <div class="v"><span class="price red">¥44.8</span></div>
            </div>
            <div class="row" style="margin-top:12px">
              <a class="mini-btn" href="./mall.html">继续逛</a>
              <a class="mini-btn primary" href="./order-confirm.html">去结算</a>
            </div>
          </article>
        </section>

        <footer class="nav app-footer" aria-label="底部导航">
          <a class="nav-item" href="./discover.html"><span class="nav-ic" aria-hidden="true"></span><span>首页</span></a>
          <a class="nav-item" href="./practice-home.html"><span class="nav-ic" aria-hidden="true"></span><span>刷题</span></a>
          <a class="nav-item" href="./community.html"><span class="nav-ic" aria-hidden="true"></span><span>社区</span></a>
          <a class="nav-item active" href="./mall.html"><span class="nav-ic" aria-hidden="true"></span><span>商城</span></a>
          <a class="nav-item" href="./me.html"><span class="nav-ic" aria-hidden="true"></span><span>我的</span></a>
        </footer>
      </section>
    </main>
  </body>
</html>
