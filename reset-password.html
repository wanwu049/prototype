<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>英圈刷题 - 忘记密码</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./nav.js" defer></script>
  </head>
  <body>
    <main class="stage">
      <section class="phone app" data-page="reset-password" aria-label="WeChat Mini Program Prototype">
        <header class="topbar app-header">
          <div class="status">
            <div class="status-left">10:01</div>
            <div class="status-right">
              <span class="pill">5G</span>
              <span class="pill">90%</span>
            </div>
          </div>

          <div class="brand">
            <a class="back-btn" href="./login.html" aria-label="返回登录页">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
                <path
                  d="M15 6 9 12l6 6"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </a>
            <div class="brand-text">
              <div class="brand-title">忘记密码</div>
              <div class="brand-subtitle">找回账号与重置密码</div>
            </div>
            <span style="width: 40px"></span>
          </div>
        </header>

        <section class="content app-content" aria-label="页面内容">
          <article class="card">
            <div class="card-hd">
              <div class="card-title">身份验证</div>
              <div class="tags"><span class="tag ghost">短信校验</span></div>
            </div>

            <div class="field">
              <div class="field-label">手机号</div>
              <input class="field-input" type="tel" placeholder="请输入注册手机号" />
            </div>
            <div class="field">
              <div class="field-label">验证码</div>
              <input class="field-input" type="text" placeholder="输入短信验证码" />
            </div>
            <div class="field">
              <div class="field-label">新密码</div>
              <input class="field-input" type="password" placeholder="设置新密码（8-20位）" />
            </div>
            <div class="field">
              <div class="field-label">确认新密码</div>
              <input class="field-input" type="password" placeholder="再次输入新密码" />
            </div>

            <div class="detail-cta" style="margin-top: 12px">
              <a class="cta wide" href="./login.html">完成重置并返回登录</a>
            </div>
          </article>

          <article class="card">
            <div class="card-hd">
              <div class="card-title">常见问题</div>
              <div class="tags"><span class="tag ghost">帮助</span></div>
            </div>
            <div class="list">
              <a class="list-item" href="./help.html">
                <div class="li-main">收不到验证码怎么办？</div>
                <div class="li-sub">检查拦截、网络、重试与联系客服</div>
              </a>
              <a class="list-item" href="./help.html">
                <div class="li-main">手机号已更换，如何找回？</div>
                <div class="li-sub">通过实名认证信息进行申诉</div>
              </a>
            </div>
          </article>
        </section>

        <footer class="nav app-footer" aria-label="底部导航">
          <a class="nav-item" href="./discover.html">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>首页</span>
          </a>
          <a class="nav-item" href="./practice-home.html">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>刷题</span>
          </a>
          <a class="nav-item" href="./community.html">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>社区</span>
          </a>
          <a class="nav-item" href="./mall.html">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>商城</span>
          </a>
          <a class="nav-item" href="./me.html">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>我的</span>
          </a>
        </footer>
      </section>
    </main>
  </body>
</html>
