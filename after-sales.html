<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>英圈刷题 - 退款售后页（交易服务）</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./nav.js" defer></script>
  </head>
  <body>
    <main class="stage">
      <section class="phone app" data-page="after-sales" aria-label="WeChat Mini Program Prototype">
        <header class="topbar app-header">
          <div class="status">
            <div class="status-left">10:01</div>
            <div class="status-right"><span class="pill">5G</span><span class="pill">90%</span></div>
          </div>
          <div class="brand">
            <a class="back-btn" href="./orders.html" aria-label="返回订单列表">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
                <path d="M15 6 9 12l6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </a>
            <div class="brand-text">
              <div class="brand-title">退款/售后</div>
              <div class="brand-subtitle">申请退款 · 查看进度 · 联系客服</div>
            </div>
            <span style="width:40px"></span>
          </div>
        </header>

        <section class="content app-content" aria-label="页面内容">
          <article class="card">
            <div class="card-hd">
              <div class="card-title">选择订单</div>
              <div class="tags"><span class="tag ghost">数字内容</span></div>
            </div>
            <div class="list">
              <a class="list-item" href="./orders.html">
                <div class="thumb" aria-hidden="true"></div>
                <div class="li-text">
                  <div class="li-main">订单：20260417-001</div>
                  <div class="li-sub">四级阅读技巧课 + 会员月卡</div>
                </div>
                <div class="li-right"><span class="badge orange">待支付</span><span class="badge">选择</span></div>
              </a>
            </div>
          </article>

          <article class="card">
            <div class="card-hd">
              <div class="card-title">售后类型</div>
              <div class="tags"><span class="tag ghost">请选择</span></div>
            </div>
            <div class="chip-grid">
              <a class="chip2 active" href="#">退款（未开通）</a>
              <a class="chip2" href="#">换课/改期</a>
              <a class="chip2" href="#">支付异常</a>
              <a class="chip2" href="#">功能无法使用</a>
            </div>
            <div class="divider"></div>
            <div class="para muted">
              说明：数字内容类商品若已开通/已观看，可能无法原路退款；可申请补偿券或更换权益，具体以审核为准。
            </div>
          </article>

          <article class="card">
            <div class="card-hd">
              <div class="card-title">填写原因（占位）</div>
              <div class="tags"><span class="tag ghost">可选</span></div>
            </div>
            <div class="para">- 我不小心购买了<br />- 内容不符合预期<br />- 支付后未开通/异常</div>
            <div class="row" style="margin-top:12px">
              <a class="mini-btn" href="./orders.html">取消</a>
              <a class="mini-btn primary" href="./orders.html">提交申请</a>
            </div>
          </article>
        </section>

        <footer class="nav app-footer" aria-label="底部导航">
          <a class="nav-item" href="./discover.html"><span class="nav-ic" aria-hidden="true"></span><span>首页</span></a>
          <a class="nav-item" href="./practice-home.html"><span class="nav-ic" aria-hidden="true"></span><span>刷题</span></a>
          <a class="nav-item" href="./community.html"><span class="nav-ic" aria-hidden="true"></span><span>社区</span></a>
          <a class="nav-item active" href="./mall.html"><span class="nav-ic" aria-hidden="true"></span><span>商城</span></a>
          <a class="nav-item" href="./me.html"><span class="nav-ic" aria-hidden="true"></span><span>我的</span></a>
        </footer>
      </section>
    </main>
  </body>
</html>
