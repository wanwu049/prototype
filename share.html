<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>英圈刷题 - 分享页（首页推荐）</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./nav.js" defer></script>
  </head>
  <body>
    <main class="stage">
      <section class="phone app" data-page="share" aria-label="WeChat Mini Program Prototype">
        <header class="topbar app-header">
          <div class="status">
            <div class="status-left">10:01</div>
            <div class="status-right">
              <span class="pill">5G</span>
              <span class="pill">90%</span>
            </div>
          </div>
          <div class="brand">
            <a class="back-btn" href="./detail.html" aria-label="返回内容详情">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
                <path
                  d="M15 6 9 12l6 6"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </a>
            <div class="brand-text">
              <div class="brand-title">分享给好友</div>
              <div class="brand-subtitle">选择好友 · 添加留言</div>
            </div>
            <span style="width:40px"></span>
          </div>
        </header>

        <section class="content app-content" aria-label="页面内容">
          <article class="card">
            <div class="card-hd">
              <div class="card-title">分享内容</div>
              <div class="tags"><span class="tag ghost">预览</span></div>
            </div>
            <div class="share-preview">
              <div class="share-thumb" aria-hidden="true"></div>
              <div class="share-text">
                <div class="meta-main">高频词汇记忆法：用场景拆分背更快</div>
                <div class="meta-sub">来自 英圈刷题 · 个性化推荐</div>
              </div>
            </div>
            <div class="chip-grid" aria-label="分享方式">
              <a class="chip2 active" href="#">微信好友</a>
              <a class="chip2" href="#">学习小组</a>
              <a class="chip2" href="#">生成海报</a>
            </div>
            <label class="field">
              <span class="field-label">留言</span>
              <input class="field-input" type="text" placeholder="写点什么…（可选）" />
            </label>
          </article>

          <article class="card">
            <div class="card-hd">
              <div class="card-title">最近联系人</div>
              <div class="tags"><span class="tag ghost">可多选</span></div>
            </div>
            <div class="contacts">
              <label class="contact">
                <input type="checkbox" />
                <span class="avatar sm" aria-hidden="true"></span>
                <span class="c-name">考研搭子小北</span>
              </label>
              <label class="contact">
                <input type="checkbox" />
                <span class="avatar sm" aria-hidden="true"></span>
                <span class="c-name">写作老师Luna</span>
              </label>
              <label class="contact">
                <input type="checkbox" />
                <span class="avatar sm" aria-hidden="true"></span>
                <span class="c-name">四级冲刺群</span>
              </label>
            </div>
            <div class="share-actions">
              <a class="mini-btn primary" href="./detail.html">确认分享</a>
              <a class="mini-btn" href="./detail.html">取消</a>
            </div>
          </article>
        </section>

        <footer class="nav app-footer" aria-label="底部导航">
          <a class="nav-item active" href="./discover.html">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>首页</span>
          </a>
          <a class="nav-item" href="./practice-home.html">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>刷题</span>
          </a>
          <a class="nav-item" href="./community.html">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>社区</span>
          </a>
          <a class="nav-item" href="./mall.html">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>商城</span>
          </a>
          <a class="nav-item" href="./me.html">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>我的</span>
          </a>
        </footer>
      </section>
    </main>
  </body>
</html>
