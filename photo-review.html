<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>英圈刷题 - 拍照批阅</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./nav.js" defer></script>
  </head>
  <body>
    <main class="stage">
      <section class="phone app" data-page="photo-review" aria-label="WeChat Mini Program Prototype">
        <header class="topbar app-header">
          <div class="status">
            <div class="status-left">10:01</div>
            <div class="status-right">
              <span class="pill">5G</span>
              <span class="pill">90%</span>
            </div>
          </div>
          <div class="brand">
            <a class="back-btn" href="./discover.html" aria-label="返回首页">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
                <path
                  d="M15 6 9 12l6 6"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </a>
            <div class="brand-text">
              <div class="brand-title">拍照批阅</div>
              <div class="brand-subtitle">拍照识别 · 自动批改 · 错题归因</div>
            </div>
            <a class="icon-btn" href="./my-learning.html" aria-label="查看学习档案">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
                <path d="M7 3h10a2 2 0 0 1 2 2v14l-3-2-3 2-3-2-3 2V5a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
                <path d="M9 8h6M9 12h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
              </svg>
            </a>
          </div>
        </header>

        <section class="content app-content" aria-label="页面内容">
          <article class="hero">
            <div class="hero-bg" aria-hidden="true"></div>
            <div class="hero-body">
              <div class="hero-title">一拍就会 · 自动批改</div>
              <div class="hero-subtitle">适用于：阅读/翻译/写作/听力填空等（原型示意）</div>
              <a class="cta" href="./messages-support.html">不会用？问客服</a>
            </div>
          </article>

          <article class="card">
            <div class="card-hd">
              <div class="card-title">开始批阅</div>
              <div class="tags"><span class="tag">推荐</span><span class="tag ghost">占位流程</span></div>
            </div>
            <div class="list">
              <a class="list-item" href="practice-photo-answer.html">
                <div class="li-main">拍照/上传题目</div>
                <div class="li-sub">支持相册导入 · 自动裁切与增强</div>
              </a>
              <a class="list-item" href="./detail.html">
                <div class="li-main">查看批改结果</div>
                <div class="li-sub">标注错误点 · 给出解析与替换建议</div>
              </a>
              <a class="list-item" href="./favorites.html">
                <div class="li-main">加入错题本</div>
                <div class="li-sub">自动归类薄弱点，支持二次练习</div>
              </a>
            </div>
            <div class="detail-cta">
              <a class="mini-btn" href="./practice-home.html">去刷题巩固</a>
              <a class="ghost-btn" href="./my-learning.html">看学习报告</a>
            </div>
          </article>

          <article class="card">
            <div class="card-hd">
              <div class="card-title">示例：批改摘要</div>
              <div class="tags"><span class="tag ghost">展示</span></div>
            </div>
            <div class="para" style="margin-top: 0">
              识别成功：1 道阅读题 + 1 句翻译。主要问题：同义替换不足、主谓一致错误、定位速度偏慢。
            </div>
            <div class="callout">建议：把错题对应的“考点标签”收藏起来，下一次做同类题优先复盘。</div>
            <div class="detail-cta">
              <a class="mini-btn" href="./detail.html">查看示例详情</a>
              <a class="ghost-btn" href="./messages-system-notice.html">看系统提醒</a>
            </div>
          </article>
        </section>

        <footer class="nav app-footer" aria-label="底部导航">
          <a class="nav-item" href="./discover.html">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>首页</span>
          </a>
          <a class="nav-item" href="./practice-home.html">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>刷题</span>
          </a>
          <a class="nav-item" href="./community.html">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>社区</span>
          </a>
          <a class="nav-item" href="./mall.html">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>商城</span>
          </a>
          <a class="nav-item" href="./me.html">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>我的</span>
          </a>
        </footer>
      </section>
    </main>
  </body>
</html>
