<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>英圈刷题 - 消息-问答交互</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./nav.js" defer></script>
  </head>
  <body>
    <main class="stage">
      <section class="phone app" data-page="messages-qa" aria-label="WeChat Mini Program Prototype">
        <header class="topbar app-header">
          <div class="status">
            <div class="status-left">10:01</div>
            <div class="status-right">
              <span class="pill">5G</span>
              <span class="pill">90%</span>
            </div>
          </div>

          <div class="brand">
            <a class="back-btn" href="./messages.html" aria-label="返回消息中心">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
                <path
                  d="M15 6 9 12l6 6"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </a>
            <div class="brand-text">
              <div class="brand-title">问答交互</div>
              <div class="brand-subtitle">点赞 · 评论回复 · 被回复 · 私信</div>
            </div>
            <a class="icon-btn" href="./comments.html" aria-label="去评论页示例">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
                <path
                  d="M4 5h16v10H8l-4 4V5Z"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linejoin="round"
                />
              </svg>
            </a>
          </div>
        </header>

        <section class="content app-content" aria-label="页面内容">
          <article class="card">
            <div class="card-hd">
              <div class="card-title">互动提醒</div>
              <div class="tags"><span class="tag">未读 3</span><span class="tag ghost">今日</span></div>
            </div>
            <div class="list">
              <a class="list-item" href="./detail.html">
                <div class="li-main">有人回复了你的提问：长难句怎么找主干？</div>
                <div class="li-sub">晨光：先找谓语动词…（点击查看详情）</div>
              </a>
              <a class="list-item" href="./comments.html">
                <div class="li-main">你的评论被点赞了</div>
                <div class="li-sub">小橙 点赞了你：这个方法太好用了</div>
              </a>
              <a class="list-item" href="./detail.html">
                <div class="li-main">你的回答被采纳</div>
                <div class="li-sub">系统：奖励 20 积分 · 去看看</div>
              </a>
            </div>
          </article>

          <article class="card">
            <div class="card-hd">
              <div class="card-title">私信（占位）</div>
              <div class="tags"><span class="tag ghost">可扩展</span></div>
            </div>
            <div class="comment composer">
              <div class="avatar sm" aria-hidden="true"></div>
              <div class="composer-box">
                <input class="field-input" type="text" placeholder="给对方发一句话…" />
                <div class="composer-actions">
                  <a class="ghost-btn" href="#">常用语</a>
                  <a class="ghost-btn" href="#">发题目</a>
                  <a class="mini-btn" href="#">发送</a>
                </div>
              </div>
            </div>
          </article>
        </section>

        <footer class="nav app-footer" aria-label="底部导航">
          <a class="nav-item" href="./discover.html">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>首页</span>
          </a>
          <a class="nav-item" href="./practice-home.html">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>刷题</span>
          </a>
          <a class="nav-item" href="./community.html">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>社区</span>
          </a>
          <a class="nav-item" href="./mall.html">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>商城</span>
          </a>
          <a class="nav-item" href="./me.html">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>我的</span>
          </a>
        </footer>
      </section>
    </main>
  </body>
</html>
