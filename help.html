<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>英圈刷题 - 帮助与反馈</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./nav.js" defer></script>
  </head>
  <body>
    <main class="stage">
      <section class="phone app" data-page="help" aria-label="WeChat Mini Program Prototype">
        <header class="topbar app-header">
          <div class="status">
            <div class="status-left">10:01</div>
            <div class="status-right">
              <span class="pill">5G</span>
              <span class="pill">90%</span>
            </div>
          </div>
          <div class="brand">
            <a class="back-btn" href="./me.html" aria-label="返回我的">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
                <path
                  d="M15 6 9 12l6 6"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </a>
            <div class="brand-text">
              <div class="brand-title">帮助与反馈</div>
              <div class="brand-subtitle">常见问题 · 在线客服 · 问题反馈</div>
            </div>
            <a class="icon-btn" href="./messages-support.html" aria-label="联系客服">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
                <path
                  d="M4 5h16v10H8l-4 4V5Z"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linejoin="round"
                />
                <path
                  d="M8 9h8M8 12h5"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linecap="round"
                />
              </svg>
            </a>
          </div>
        </header>

        <section class="content app-content" aria-label="页面内容">
          <section class="panel">
            <div class="panel-title">快速入口</div>
            <div class="chip-grid" role="list">
              <a class="chip2 active" href="./messages-support.html" role="listitem">在线客服</a>
              <a class="chip2" href="./reset-password.html" role="listitem">找回密码</a>
              <a class="chip2" href="./orders.html" role="listitem">订单问题</a>
              <a class="chip2" href="./settings.html" role="listitem">隐私设置</a>
            </div>
          </section>

          <article class="card">
            <div class="card-hd">
              <div class="card-title">常见问题</div>
              <div class="tags"><span class="tag ghost">FAQ</span></div>
            </div>
            <div class="list">
              <a class="list-item" href="./reset-password.html">
                <div class="li-main">收不到验证码怎么办？</div>
                <div class="li-sub">检查短信拦截/黑名单，切换网络后重试</div>
              </a>
              <a class="list-item" href="./orders.html">
                <div class="li-main">如何申请退款或开发票？</div>
                <div class="li-sub">订单详情页可发起申请（原型入口）</div>
              </a>
              <a class="list-item" href="./my-learning.html">
                <div class="li-main">学习报告为什么不准？</div>
                <div class="li-sub">完善档案、增加练习样本可提升准确率</div>
              </a>
              <a class="list-item" href="./profile-edit.html">
                <div class="li-main">账号被限制发帖怎么办？</div>
                <div class="li-sub">按提示修改资料，或向客服提交申诉</div>
              </a>
            </div>
          </article>

          <article class="card">
            <div class="card-hd">
              <div class="card-title">反馈问题</div>
              <div class="tags"><span class="tag ghost">占位表单</span></div>
            </div>
            <div class="field">
              <div class="field-label">问题类型</div>
              <input class="field-input" type="text" placeholder="例如：刷题异常 / 支付问题 / 内容举报" />
            </div>
            <div class="field">
              <div class="field-label">问题描述</div>
              <input class="field-input" type="text" placeholder="尽量描述清楚：出现时间、操作路径、截图等" />
            </div>
            <div class="detail-cta" style="margin-top: 12px">
              <a class="mini-btn" href="./messages-support.html">提交并联系在线客服</a>
              <a class="ghost-btn" href="./messages-system-notice.html">查看系统通知</a>
            </div>
          </article>
        </section>

        <footer class="nav app-footer" aria-label="底部导航">
          <a class="nav-item" href="./discover.html">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>首页</span>
          </a>
          <a class="nav-item" href="./practice-home.html">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>刷题</span>
          </a>
          <a class="nav-item" href="./community.html">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>社区</span>
          </a>
          <a class="nav-item" href="./mall.html">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>商城</span>
          </a>
          <a class="nav-item active" href="./me.html">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>我的</span>
          </a>
        </footer>
      </section>
    </main>
  </body>
</html>
