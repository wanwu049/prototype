<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>英圈刷题 - 编辑资料</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./nav.js" defer></script>
  </head>
  <body>
    <main class="stage">
      <section class="phone app" data-page="profile-edit" aria-label="WeChat Mini Program Prototype">
        <header class="topbar app-header">
          <div class="status">
            <div class="status-left">10:01</div>
            <div class="status-right">
              <span class="pill">5G</span>
              <span class="pill">90%</span>
            </div>
          </div>
          <div class="brand">
            <a class="back-btn" href="./me.html" aria-label="返回我的">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
                <path
                  d="M15 6 9 12l6 6"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </a>
            <div class="brand-text">
              <div class="brand-title">编辑资料</div>
              <div class="brand-subtitle">昵称 · 头像 · 签名 · 学习目标</div>
            </div>
            <a class="icon-btn" href="./me.html" aria-label="保存">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
                <path
                  d="M20 6v14H4V4h12l4 2Z"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linejoin="round"
                />
                <path
                  d="M8 20v-7h8v7"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linejoin="round"
                />
                <path
                  d="M8 4v6h7"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linecap="round"
                />
              </svg>
            </a>
          </div>
        </header>

        <section class="content app-content" aria-label="页面内容">
          <article class="card">
            <div class="card-hd">
              <div class="card-title">基础信息</div>
              <div class="tags"><span class="tag ghost">原型</span></div>
            </div>

            <div class="field">
              <div class="field-label">昵称</div>
              <input class="field-input" type="text" placeholder="例如：学习者 13157" value="学习者 13157" />
            </div>
            <div class="field">
              <div class="field-label">个性签名</div>
              <input class="field-input" type="text" placeholder="写一句你的学习宣言" value="每天进步一点点" />
            </div>
            <div class="field">
              <div class="field-label">目标考试</div>
              <input class="field-input" type="text" placeholder="例如：CET-4 / 雅思" value="CET-4" />
            </div>
            <div class="field">
              <div class="field-label">目标分数</div>
              <input class="field-input" type="number" placeholder="例如：550" value="550" />
            </div>

            <div class="detail-cta" style="margin-top: 12px">
              <a class="mini-btn" href="./me.html">保存</a>
              <a class="ghost-btn danger" href="./help.html">注销/退出（占位）</a>
            </div>
          </article>

          <article class="card">
            <div class="card-hd">
              <div class="card-title">账号安全</div>
              <div class="tags"><span class="tag ghost">入口</span></div>
            </div>
            <div class="list">
              <a class="list-item" href="./reset-password.html">
                <div class="li-main">修改密码</div>
                <div class="li-sub">通过短信验证重置密码</div>
              </a>
              <a class="list-item" href="./verify-id.html">
                <div class="li-main">实名认证</div>
                <div class="li-sub">用于账号找回与安全风控</div>
              </a>
            </div>
          </article>
        </section>

        <footer class="nav app-footer" aria-label="底部导航">
          <a class="nav-item" href="./discover.html">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>首页</span>
          </a>
          <a class="nav-item" href="./practice-home.html">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>刷题</span>
          </a>
          <a class="nav-item" href="./community.html">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>社区</span>
          </a>
          <a class="nav-item" href="./mall.html">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>商城</span>
          </a>
          <a class="nav-item active" href="./me.html">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>我的</span>
          </a>
        </footer>
      </section>
    </main>
  </body>
</html>
