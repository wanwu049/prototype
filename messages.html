<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>英圈刷题 - 消息中心</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./nav.js" defer></script>
  </head>
  <body>
    <main class="stage">
      <section class="phone app" data-page="messages" aria-label="WeChat Mini Program Prototype">
        <header class="topbar app-header">
          <div class="status">
            <div class="status-left">10:01</div>
            <div class="status-right">
              <span class="pill">5G</span>
              <span class="pill">90%</span>
            </div>
          </div>

          <div class="brand">
            <a class="back-btn" href="./discover.html" aria-label="返回首页">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
                <path
                  d="M15 6 9 12l6 6"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </a>
            <div class="brand-text">
              <div class="brand-title">消息中心</div>
              <div class="brand-subtitle">好友 · 问答交互 · 系统通知 · 平台客服</div>
            </div>
            <a class="icon-btn" href="./settings.html" aria-label="消息设置">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
                <path
                  d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4Z"
                  stroke="currentColor"
                  stroke-width="1.6"
                />
                <path
                  d="M19.4 12a7.4 7.4 0 0 0-.1-1.2l2-1.5-2-3.4-2.4 1a7.7 7.7 0 0 0-2-1.2l-.4-2.6H9.5l-.4 2.6a7.7 7.7 0 0 0-2 1.2l-2.4-1-2 3.4 2 1.5A7.4 7.4 0 0 0 4.6 12c0 .4 0 .8.1 1.2l-2 1.5 2 3.4 2.4-1a7.7 7.7 0 0 0 2 1.2l.4 2.6h4.9l.4-2.6a7.7 7.7 0 0 0 2-1.2l2.4 1 2-3.4-2-1.5c.1-.4.1-.8.1-1.2Z"
                  stroke="currentColor"
                  stroke-width="1.2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  opacity=".9"
                />
              </svg>
            </a>
          </div>
        </header>

        <section class="content app-content" aria-label="页面内容">
          <article class="hero">
            <div class="hero-bg" aria-hidden="true"></div>
            <div class="hero-body">
              <div class="hero-title">你有 6 条未读消息</div>
              <div class="hero-subtitle">优先处理学习相关提醒，避免错过答疑</div>
              <a class="cta" href="./messages-system-notice.html">查看通知</a>
            </div>
          </article>

          <article class="card">
            <div class="card-hd">
              <div class="card-title">消息分类</div>
              <div class="tags"><span class="tag ghost">入口</span></div>
            </div>
            <div class="list">
              <a class="list-item" href="./messages-friends.html">
                <div class="li-main">消息-好友</div>
                <div class="li-sub">与好友聊天、查看聊天记录</div>
              </a>
              <a class="list-item" href="./messages-qa.html">
                <div class="li-main">消息-问答交互</div>
                <div class="li-sub">点赞、评论回复、被回复的问答与私信</div>
              </a>
              <a class="list-item" href="./messages-system-notice.html">
                <div class="li-main">消息-系统通知</div>
                <div class="li-sub">平台公告、活动提醒、处理告警</div>
              </a>
              <a class="list-item" href="./messages-support.html">
                <div class="li-main">消息-平台客服</div>
                <div class="li-sub">AI 或人工客服答疑、工单进度</div>
              </a>
            </div>
          </article>
        </section>

        <footer class="nav app-footer" aria-label="底部导航">
          <a class="nav-item" href="./discover.html">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>首页</span>
          </a>
          <a class="nav-item" href="./practice-home.html">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>刷题</span>
          </a>
          <a class="nav-item" href="./community.html">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>社区</span>
          </a>
          <a class="nav-item" href="./mall.html">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>商城</span>
          </a>
          <a class="nav-item" href="./me.html">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>我的</span>
          </a>
        </footer>
      </section>
    </main>
  </body>
</html>
