<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>英圈刷题 - 认证码验证页</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./nav.js" defer></script>
  </head>
  <body>
    <main class="stage">
      <section class="phone app" data-page="verify-id" aria-label="WeChat Mini Program Prototype">
        <header class="topbar app-header">
          <div class="status">
            <div class="status-left">10:01</div>
            <div class="status-right">
              <span class="pill">5G</span>
              <span class="pill">90%</span>
            </div>
          </div>

          <div class="brand">
            <a class="back-btn" href="./register.html" aria-label="返回注册页">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
                <path
                  d="M15 6 9 12l6 6"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </a>
            <div class="brand-text">
              <div class="brand-title">认证码验证</div>
              <div class="brand-subtitle">输入校验码 · 完成实名认证校验</div>
            </div>
            <span style="width: 40px"></span>
          </div>
        </header>

        <section class="content app-content" aria-label="页面内容">
          <article class="card">
            <div class="card-hd">
              <div class="card-title">实名认证</div>
              <div class="tags"><span class="tag ghost">占位流程</span></div>
            </div>

            <div class="field">
              <div class="field-label">姓名</div>
              <input class="field-input" type="text" placeholder="请输入真实姓名" />
            </div>
            <div class="field">
              <div class="field-label">身份证号</div>
              <input class="field-input" type="text" placeholder="请输入身份证号" />
            </div>
            <div class="field">
              <div class="field-label">认证码</div>
              <input class="field-input" type="text" placeholder="请输入校验码" />
            </div>

            <div class="detail-cta" style="margin-top: 12px">
              <a class="mini-btn" href="./discover.html">完成并进入</a>
              <a class="ghost-btn" href="./help.html">遇到问题</a>
            </div>
          </article>
        </section>

        <footer class="nav app-footer" aria-label="底部导航">
          <a class="nav-item" href="./discover.html">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>首页</span>
          </a>
          <a class="nav-item" href="./practice-home.html">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>刷题</span>
          </a>
          <a class="nav-item" href="./community.html">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>社区</span>
          </a>
          <a class="nav-item" href="./mall.html">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>商城</span>
          </a>
          <a class="nav-item" href="./me.html">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>我的</span>
          </a>
        </footer>
      </section>
    </main>
  </body>
</html>
