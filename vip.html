    <main class="stage">
      <section class="phone app" data-page="vip" aria-label="WeChat Mini Program Prototype">
        <header class="topbar app-header">
          <div class="status">
            <div class="status-left">10:01</div>
            <div class="status-right">
              <span class="pill">5G</span>
              <span class="pill">90%</span>
            </div>
          </div>
          <div class="brand">
            <a class="back-btn" href="./me.html" aria-label="返回我的">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none">

                <path
                  d="M7 3h10a2 2 0 0 1 2 2v14l-3-2-3 2-3-2-3 2V5a2 2 0 0 1 2-2Z"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linejoin="round"

        <section class="content app-content" aria-label="页面内容">
          <article class="hero">
            <div class="hero-bg" aria-hidden="true"></div>
            <div class="hero-body">
              <div class="hero-title">会员 · AI 提分加速</div>

              <a class="cta" href="./orders.html">立即开通</a>

            <div class="card-hd">
              <div class="card-title">推荐方案</div>
              <div class="tags"><span class="tag">省 35%</span><span class="tag ghost">热门</span></div>
            </div>
            <div class="list">
              <a class="list-item" href="./orders.html">
                <div class="li-main">月度会员</div>
                <div class="li-sub">¥29 / 月 · 适合短期冲刺</div>

              <a class="list-item" href="./orders.html">
                <div class="li-main">季度会员</div>
                <div class="li-sub">¥69 / 季 · 适合系统提升</div>

              <div class="tags"><span class="tag ghost">示例</span></div>

            <div class="list">
              <div class="list-item" role="listitem">
                <div class="li-main">AI 解析与错题归因</div>
                <div class="li-sub">定位薄弱点，给出下一步练习计划</div>
              </div>
              <div class="list-item" role="listitem">
                <div class="li-main">口语陪练与跟读纠音</div>
                <div class="li-sub">多场景素材，实时反馈发音与语调</div>
              </div>
              <div class="list-item" role="listitem">
                <div class="li-main">学习报告与预测分</div>
                <div class="li-sub">每周总结，针对性推荐试题与课程</div>
              </div>

            <div class="detail-cta">
              <a class="ghost-btn" href="./help.html">了解规则</a>
              <a class="mini-btn" href="./messages-support.html">咨询客服</a>
