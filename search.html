<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>英圈刷题 - 搜索页（首页推荐）</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./nav.js" defer></script>
  </head>
  <body>
    <main class="stage">
      <section class="phone app" data-page="search" aria-label="WeChat Mini Program Prototype">
        <header class="topbar app-header">
          <div class="status">
            <div class="status-left">10:01</div>
            <div class="status-right">
              <span class="pill">5G</span>
              <span class="pill">90%</span>
            </div>
          </div>
          <div class="brand">
            <a class="back-btn" href="./discover.html" aria-label="返回首页">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
                <path
                  d="M15 6 9 12l6 6"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </a>
            <div class="brand-text">
              <div class="brand-title">搜索</div>
              <div class="brand-subtitle">试题 · 课程 · UGC · 用户 · 口语素材</div>
            </div>
            <span style="width:40px"></span>
          </div>

          <div class="search-wrap">
            <div class="search">
              <svg class="search-ic" viewBox="0 0 24 24" width="18" height="18" fill="none">
                <path
                  d="M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15Z"
                  stroke="currentColor"
                  stroke-width="1.6"
                />
                <path
                  d="M16.5 16.5 21 21"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linecap="round"
                />
              </svg>
              <input class="search-input" type="text" value="四级 阅读" aria-label="搜索输入框" />
              <a class="mini-btn primary" href="./search-results.html" aria-label="搜索">搜索</a>
            </div>
          </div>
        </header>

        <section class="content app-content" aria-label="页面内容">
          <article class="card">
            <div class="card-hd">
              <div class="card-title">搜索历史</div>
              <div class="tags"><span class="tag ghost">清空</span></div>
            </div>
            <div class="chip-grid">
              <a class="chip2" href="./search-results.html">CET-4 阅读</a>
              <a class="chip2" href="./search-results.html">写作模板</a>
              <a class="chip2" href="./search-results.html">长难句</a>
              <a class="chip2" href="./search-results.html">口语跟读</a>
            </div>
          </article>

          <article class="card">
            <div class="card-hd">
              <div class="card-title">热门搜索</div>
              <div class="tags"><span class="tag">TOP</span></div>
            </div>
            <div class="list">
              <a class="list-item" href="./search-results.html">
                <div class="thumb" aria-hidden="true" style="background:linear-gradient(135deg, rgba(245,158,11,.55), rgba(47,214,255,.45));"></div>
                <div class="li-text">
                  <div class="li-main">四级高频词汇（速记）</div>
                  <div class="li-sub">试题/UGC · 高频搭配</div>
                </div>
                <div class="li-right">
                  <span class="badge orange">热</span>
                  <span class="badge">词汇</span>
                </div>
              </a>
              <a class="list-item" href="./search-results.html">
                <div class="thumb" aria-hidden="true"></div>
                <div class="li-text">
                  <div class="li-main">阅读定位技巧（真题）</div>
                  <div class="li-sub">试题 · 适配 四六级</div>
                </div>
                <div class="li-right">
                  <span class="badge blue">试题</span>
                  <span class="badge green">推荐</span>
                </div>
              </a>
              <a class="list-item" href="./search-results.html">
                <div class="thumb" aria-hidden="true" style="background:linear-gradient(135deg, rgba(124,58,237,.65), rgba(47,214,255,.42));"></div>
                <div class="li-text">
                  <div class="li-main">写作替换词（高分表达）</div>
                  <div class="li-sub">UGC · 980 收藏</div>
                </div>
                <div class="li-right">
                  <span class="badge orange">UGC</span>
                  <span class="badge">写作</span>
                </div>
              </a>
            </div>
          </article>

          <article class="card">
            <div class="card-hd">
              <div class="card-title">搜索建议</div>
              <div class="tags"><span class="tag ghost">根据热度</span></div>
            </div>
            <div class="chip-grid">
              <a class="chip2 active" href="./search-results.html">阅读 主旨题</a>
              <a class="chip2" href="./search-results.html">阅读 细节题</a>
              <a class="chip2" href="./search-results.html">写作 开头句</a>
              <a class="chip2" href="./search-results.html">翻译 句型</a>
            </div>
          </article>
        </section>

        <footer class="nav app-footer" aria-label="底部导航">
          <a class="nav-item active" href="./discover.html">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>首页</span>
          </a>
          <a class="nav-item" href="./practice-home.html">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>刷题</span>
          </a>
          <a class="nav-item" href="./community.html">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>社区</span>
          </a>
          <a class="nav-item" href="./mall.html">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>商城</span>
          </a>
          <a class="nav-item" href="./me.html">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>我的</span>
          </a>
        </footer>
      </section>
    </main>
  </body>
</html>
