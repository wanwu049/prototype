<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>英圈刷题 - 拍照答题页（刷题诊断）</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./nav.js" defer></script>
  </head>
  <body>
    <main class="stage">
      <section class="phone app" data-page="practice-photo-answer" aria-label="WeChat Mini Program Prototype">
        <header class="topbar app-header">
          <div class="status">
            <div class="status-left">10:01</div>
            <div class="status-right"><span class="pill">5G</span><span class="pill">90%</span></div>
          </div>
          <div class="brand">
            <a class="back-btn" href="./practice-home.html" aria-label="返回刷题首页">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
                <path d="M15 6 9 12l6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </a>
            <div class="brand-text">
              <div class="brand-title">拍照答题</div>
              <div class="brand-subtitle">上传答题卡/手写作业 · AI 识别自动批改</div>
            </div>
            <span style="width:40px"></span>
          </div>
        </header>

        <section class="content app-content" aria-label="页面内容">

        <style>
          /* 扫描线动画 */
          @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }
          
          /* 原有工具类样式 */
          .kv { display: grid; grid-template-columns: auto 1fr; gap: 8px 15px; font-size: 13px; margin-bottom: 15px; }
          .kv .k { color: var(--muted, #6b7a90); }
          .kv .v { font-weight: 900; color: var(--text, #0d1b2a); }
          .divider { height: 1px; background: var(--line, #eee); margin: 15px 0; }
          .row { display: flex; gap: 10px; }
          .mini-btn { flex: 1; padding: 12px; border-radius: 12px; font-weight: 900; font-size: 14px; text-align: center; border: none; cursor: pointer; text-decoration: none; display: inline-block; transition: opacity 0.2s; }
          .mini-btn:active { opacity: 0.8; }
          .mini-btn { background: #f0f2f5; color: var(--text, #0d1b2a); }
          .mini-btn.primary { background: var(--blue, #1e6bff); color: white; }
          
          /* 快门按钮点击反馈 */
          .shutter-btn { transition: transform 0.1s; }
          .shutter-btn:active { transform: scale(0.9); }
        </style>
        
        <article class="card" id="camera-card" style="padding: 20px;">
          <div id="state-taking">
            <div class="card-hd" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
              <div class="card-title" style="font-size: 16px; font-weight: 950; color: var(--text, #0d1b2a);">对准试卷 / 答题卡</div>
              <div class="tags">
                <span class="tag" style="background: rgba(30,107,255,0.1); color: var(--blue, #1e6bff); padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 800;">AI自动捕捉</span>
              </div>
            </div>
            
            <div class="cover" style="height: 350px; background: #000; border-radius: 16px; position: relative; overflow: hidden; margin-bottom: 24px; display: flex; justify-content: center; align-items: center; box-shadow: inset 0 4px 12px rgba(0,0,0,0.5);">
              
              <div style="width: 85%; height: 85%; border: 2px solid var(--blue, #1e6bff); border-radius: 10px; position: relative; box-shadow: 0 0 0 999px rgba(0,0,0,0.65);">
                <div style="position: absolute; width: 100%; height: 3px; background: var(--blue, #1e6bff); box-shadow: 0 0 15px 2px var(--blue, #1e6bff); animation: scan 2s ease-in-out infinite alternate;"></div>
              </div>
            </div>
            
            <div style="display: flex; justify-content: space-between; align-items: center; padding: 0 15px 10px;">
              <div style="font-size: 14px; font-weight: 800; color: var(--muted, #6b7a90); cursor: pointer; padding: 10px;">相册导入</div>
              
              <div class="shutter-btn" onclick="capturePhoto()" style="width: 72px; height: 72px; border-radius: 50%; border: 4px solid var(--blue, #1e6bff); display: flex; justify-content: center; align-items: center; cursor: pointer; box-shadow: 0 8px 20px rgba(30,107,255,0.25);">
                <div style="width: 56px; height: 56px; background: var(--blue, #1e6bff); border-radius: 50%;"></div>
              </div>
              
              <div style="font-size: 14px; font-weight: 800; color: var(--muted, #6b7a90); cursor: pointer; padding: 10px;">答题记录</div>
            </div>
          </div>
        
          <div id="state-preview" style="display:none;">
            <div class="card-hd" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
              <div class="card-title" style="font-size: 16px; font-weight: 950;">预览区域</div>
              <div class="tags">
                <span class="tag ghost" style="color: #f39c12; border-color: transparent; background: rgba(243,156,18,0.15); padding: 4px 10px; border-radius: 12px; font-weight: 800;">识别成功</span>
              </div>
            </div>
            
            <div class="cover" aria-hidden="true" style="height: 180px; background: linear-gradient(135deg, #e1e6f0, #f4f7fb); border-radius: 14px; margin-bottom: 18px; border: 1px solid #eee; display: flex; justify-content: center; align-items: center; font-weight: 900; color: #999;">
              [答题卡照片]
            </div>
            
            <div class="kv">
              <div class="k">识别题目</div>
              <div class="v">15 题</div>
              <div class="k">识别答题卡</div>
              <div class="v" style="color: var(--blue, #1e6bff);">已匹配</div>
              <div class="k">预计用时</div>
              <div class="v">约 20 秒</div>
            </div>
            
            <div class="divider"></div>
            
            <div class="row">
              <a class="mini-btn" href="#" onclick="retakePhoto(); return false;">重新拍摄</a>
              <a class="mini-btn primary" href="practice-ai-result.html">提交并批改</a>
            </div>
          </div>
        </article>
        
        <script>
          function capturePhoto() {
            document.getElementById('state-taking').style.display = 'none';
            document.getElementById('state-preview').style.display = 'block';
          }
        
          function retakePhoto() {
            document.getElementById('state-preview').style.display = 'none';
            document.getElementById('state-taking').style.display = 'block';
          }
        </script>
        <script>
          // 简单的状态切换逻辑
          function capturePhoto() {
            // 隐藏取景框，显示预览信息
            document.getElementById('state-taking').style.display = 'none';
            document.getElementById('state-preview').style.display = 'block';
          }
        
          function retakePhoto() {
            // 隐藏预览信息，返回取景框
            document.getElementById('state-preview').style.display = 'none';
            document.getElementById('state-taking').style.display = 'block';
          }
        </script>
        </section>

        <footer class="nav app-footer" aria-label="底部导航">
          <a class="nav-item" href="./discover.html"><span class="nav-ic" aria-hidden="true"></span><span>首页</span></a>
          <a class="nav-item active" href="./practice-home.html"><span class="nav-ic" aria-hidden="true"></span><span>刷题</span></a>
          <a class="nav-item" href="./community.html"><span class="nav-ic" aria-hidden="true"></span><span>社区</span></a>
          <a class="nav-item" href="./mall.html"><span class="nav-ic" aria-hidden="true"></span><span>商城</span></a>
          <a class="nav-item" href="./me.html"><span class="nav-ic" aria-hidden="true"></span><span>我的</span></a>
        </footer>
      </section>
    </main>
  </body>
</html>
