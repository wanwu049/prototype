<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>英圈刷题 - 知识点专项练习页（刷题诊断）</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./nav.js" defer></script>
  </head>
  <body>
    <main class="stage">
      <section class="phone app" data-page="practice-topic-train" aria-label="WeChat Mini Program Prototype">
        <header class="topbar app-header">
          <div class="status">
            <div class="status-left">10:01</div>
            <div class="status-right"><span class="pill">5G</span><span class="pill">90%</span></div>
          </div>
          <div class="brand">
            <a class="back-btn" href="./practice-home.html" aria-label="返回刷题首页">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
                <path d="M15 6 9 12l6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </a>
            <div class="brand-text">
              <div class="brand-title">专项练习</div>
              <div class="brand-subtitle">针对薄弱知识点进行训练</div>
            </div>
            <a class="icon-btn" href="./practice-diagnosis-report.html" aria-label="诊断报告">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
                <path d="M6 4h12a2 2 0 0 1 2 2v14H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="1.6" />
                <path d="M8 8h8M8 12h8M8 16h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
              </svg>
            </a>
          </div>
        </header>

        <section class="content app-content" aria-label="页面内容">
          <section class="panel" aria-label="专项选择">
            <div class="panel-title">选择专项</div>
            <div class="chip-grid">
              <a class="chip2 active" href="#">阅读定位</a>
              <a class="chip2" href="#">同义替换</a>
              <a class="chip2" href="#">主旨题</a>
              <a class="chip2" href="#">固定搭配</a>
              <a class="chip2" href="#">时态语法</a>
            </div>
          </section>

          <section class="stats" aria-label="专项概览">
            <div class="stat kpi">
              <div class="stat-num">61%</div>
              <div class="stat-lab">掌握度</div>
              <div class="stat-mini">目标：75%</div>
            </div>
            <div class="stat">
              <div class="stat-num">20</div>
              <div class="stat-lab">推荐题量</div>
              <div class="stat-mini">分 2 天完成</div>
            </div>
            <div class="stat">
              <div class="stat-num">P1</div>
              <div class="stat-lab">优先级</div>
              <div class="stat-mini">薄弱点</div>
            </div>
          </section>

          <article class="card">
            <div class="card-hd">
              <div class="card-title">训练模式</div>
              <div class="tags"><span class="tag ghost">可切换</span></div>
            </div>
            <div class="chip-grid">
              <a class="chip2 active" href="#">限时 18 分钟</a>
              <a class="chip2" href="#">不限时</a>
              <a class="chip2" href="#">只练错题</a>
              <a class="chip2" href="#">按难度</a>
            </div>
            <div class="divider"></div>
            <div class="row">
              <a class="mini-btn" href="./practice-wrongbook.html">看错题</a>
              <a class="mini-btn primary" href="./practice-quiz.html">开始训练</a>
            </div>
          </article>

          <article class="card">
            <div class="card-hd">
              <div class="card-title">推荐题单</div>
              <div class="tags"><span class="tag ghost">按薄弱点生成</span></div>
            </div>
            <div class="list">
              <a class="list-item" href="./practice-quiz.html">
                <div class="thumb" aria-hidden="true"></div>
                <div class="li-text">
                  <div class="li-main">细节题定位训练（10 题）</div>
                  <div class="li-sub">预计 12 分钟 · 含解析</div>
                </div>
                <div class="li-right"><span class="badge blue">开始</span><span class="badge green">推荐</span></div>
              </a>
              <a class="list-item" href="./practice-quiz.html">
                <div class="thumb" aria-hidden="true" style="background:linear-gradient(135deg, rgba(16,185,129,.55), rgba(47,214,255,.42));"></div>
                <div class="li-text">
                  <div class="li-main">同义替换速刷（10 题）</div>
                  <div class="li-sub">预计 10 分钟 · 提升命中率</div>
                </div>
                <div class="li-right"><span class="badge">开始</span><span class="badge">加练</span></div>
              </a>
            </div>
          </article>
        </section>

        <footer class="nav app-footer" aria-label="底部导航">
          <a class="nav-item" href="./discover.html"><span class="nav-ic" aria-hidden="true"></span><span>首页</span></a>
          <a class="nav-item active" href="./practice-home.html"><span class="nav-ic" aria-hidden="true"></span><span>刷题</span></a>
          <a class="nav-item" href="./community.html"><span class="nav-ic" aria-hidden="true"></span><span>社区</span></a>
          <a class="nav-item" href="./mall.html"><span class="nav-ic" aria-hidden="true"></span><span>商城</span></a>
          <a class="nav-item" href="./me.html"><span class="nav-ic" aria-hidden="true"></span><span>我的</span></a>
        </footer>
      </section>
    </main>
  </body>
</html>
