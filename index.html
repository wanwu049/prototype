<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>英圈刷题 - 首页推荐原型</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="stage">
      <section class="phone app" data-page="discover" aria-label="WeChat Mini Program Prototype">
        <header class="topbar app-header">
          <div class="status">
            <div class="status-left">10:01</div>
            <div class="status-right">
              <span class="pill">5G</span>
              <span class="pill">90%</span>
            </div>
          </div>
          <div class="brand">
            <div class="logo" aria-hidden="true"></div>
            <div class="brand-text">
              <div class="brand-title">英圈刷题</div>
              <div class="brand-subtitle">AI提分 · UGC共创 · 语伴陪练</div>
            </div>
            <button class="icon-btn" type="button" aria-label="消息">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
                <path
                  d="M7.5 9.5c0-2.761 2.015-5 4.5-5s4.5 2.239 4.5 5v3.3l1.1 1.4c.6.8.05 1.8-.95 1.8H7.85c-1 0-1.55-1-.95-1.8l1.1-1.4V9.5Z"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <path
                  d="M10 18.2c.3 1.1 1.1 1.8 2 1.8s1.7-.7 2-1.8"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linecap="round"
                />
              </svg>
            </button>
          </div>

          <div class="search-wrap">
            <div class="search">
              <svg class="search-ic" viewBox="0 0 24 24" width="18" height="18" fill="none">
                <path
                  d="M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15Z"
                  stroke="currentColor"
                  stroke-width="1.6"
                />
                <path
                  d="M16.5 16.5 21 21"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linecap="round"
                />
              </svg>
              <input
                class="search-input"
                type="text"
                placeholder="搜索试题/课程/UGC干货/用户/口语素材"
                aria-label="搜索"
              />
            </div>

            <div class="chips" aria-label="快捷筛选">
              <button class="chip" type="button">
                <span class="dot blue"></span>分类
              </button>
              <button class="chip" type="button">
                <span class="dot red"></span>考试：四六级
              </button>
              <button class="chip icon" type="button" aria-label="筛选">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
                  <path
                    d="M4 6h16M7 12h10M10 18h4"
                    stroke="currentColor"
                    stroke-width="1.7"
                    stroke-linecap="round"
                  />
                </svg>
              </button>
            </div>
          </div>

          <nav class="tabs" aria-label="首页标签">
            <a class="tab active" href="./discover.html" aria-current="page">发现</a>
            <a class="tab" href="./category.html">分类</a>
            <a class="tab" href="./following.html">关注</a>
          </nav>
        </header>

        <section class="content app-content" aria-label="页面内容">
          <article class="hero">
            <div class="hero-bg" aria-hidden="true"></div>
            <div class="hero-body">
              <div class="hero-title">发现 · 个性化推荐</div>
              <div class="hero-subtitle">试题 · 课程 · UGC干货，为你精准推送</div>
              <button class="cta" type="button">立即诊断</button>
            </div>
          </article>

          <section class="actions" aria-label="快捷入口">
            <a class="action" href="#" aria-label="刷题诊断">
              <span class="action-ic">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none">
                  <path
                    d="M7 3h10a2 2 0 0 1 2 2v14l-3-2-3 2-3-2-3 2V5a2 2 0 0 1 2-2Z"
                    stroke="currentColor"
                    stroke-width="1.6"
                    stroke-linejoin="round"
                  />
                  <path
                    d="M9 8h6M9 12h6"
                    stroke="currentColor"
                    stroke-width="1.6"
                    stroke-linecap="round"
                  />
                </svg>
              </span>
              <span class="action-txt">刷题诊断</span>
            </a>
            <a class="action" href="#" aria-label="拍照批阅">
              <span class="action-ic">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none">
                  <path
                    d="M8 7h8l1.2 2H20a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h2.8L8 7Z"
                    stroke="currentColor"
                    stroke-width="1.6"
                    stroke-linejoin="round"
                  />
                  <path
                    d="M12 18a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"
                    stroke="currentColor"
                    stroke-width="1.6"
                  />
                </svg>
              </span>
              <span class="action-txt">拍照批阅</span>
            </a>
            <a class="action" href="#" aria-label="口语社交">
              <span class="action-ic">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none">
                  <path
                    d="M5 5h10a3 3 0 0 1 3 3v2a3 3 0 0 1-3 3H10l-4 4v-4H5a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3Z"
                    stroke="currentColor"
                    stroke-width="1.6"
                    stroke-linejoin="round"
                  />
                  <path
                    d="M15.5 14.5h1.2a3.3 3.3 0 0 0 3.3-3.3V9.5"
                    stroke="currentColor"
                    stroke-width="1.6"
                    stroke-linecap="round"
                  />
                </svg>
              </span>
              <span class="action-txt">口语社交</span>
            </a>
            <a class="action" href="#" aria-label="内容UGC">
              <span class="action-ic">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none">
                  <path
                    d="M4 19.5V6a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v9l-4 4H6a2 2 0 0 1-2-2Z"
                    stroke="currentColor"
                    stroke-width="1.6"
                    stroke-linejoin="round"
                  />
                  <path
                    d="M8 8h6M8 11.5h6M8 15h4"
                    stroke="currentColor"
                    stroke-width="1.6"
                    stroke-linecap="round"
                  />
                </svg>
              </span>
              <span class="action-txt">内容UGC</span>
            </a>
          </section>

          <section class="cards" aria-label="推荐内容">
            <article class="card">
              <div class="card-hd">
                <div class="card-title">推荐试题</div>
                <div class="tags">
                  <span class="tag">真题</span>
                  <span class="tag ghost">限时</span>
                </div>
              </div>
              <div class="card-row">
                <div class="meta">
                  <div class="meta-main">CET-4 近5年高频题（阅读+词汇）</div>
                  <div class="meta-sub">预计 18 分钟 · 完成度 62%</div>
                </div>
                <button class="mini-btn" type="button">去刷题</button>
              </div>
              <div class="bar" aria-hidden="true">
                <span style="width: 62%"></span>
              </div>
            </article>

            <article class="card">
              <div class="card-hd">
                <div class="card-title">UGC干货推荐</div>
                <div class="tags">
                  <span class="tag">方法</span>
                  <span class="tag ghost">收藏</span>
                </div>
              </div>
              <div class="ugc">
                <div class="avatar" aria-hidden="true"></div>
                <div class="ugc-body">
                  <div class="meta-main">高频词汇记忆法：用场景拆分背更快</div>
                  <div class="meta-sub">by 学霸阿沐 · 2.1k 赞</div>
                </div>
              </div>
            </article>

            <article class="card grid2">
              <div class="mini-card">
                <div class="mini-title">口语打卡</div>
                <div class="mini-sub">连续 6 天 · 今日话题</div>
                <div class="mini-chip">开始跟读</div>
              </div>
              <div class="mini-card alt">
                <div class="mini-title">课程/套卷精选</div>
                <div class="mini-sub">精选套卷 · 适配考纲</div>
                <div class="mini-chip price">¥9.9 起</div>
              </div>
            </article>
          </section>
        </section>

        <footer class="nav app-footer" aria-label="底部导航">
          <a class="nav-item active" href="./index.html" aria-current="page">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>首页</span>
          </a>
          <a class="nav-item" href="#" aria-label="刷题页（占位）">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>刷题</span>
          </a>
          <a class="nav-item" href="#" aria-label="社区页（占位）">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>社区</span>
          </a>
          <a class="nav-item" href="#" aria-label="商城页（占位）">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>商城</span>
          </a>
          <a class="nav-item" href="#" aria-label="我的页（占位）">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>我的</span>
          </a>
        </footer>
      </section>
    </main>
  </body>
</html>
