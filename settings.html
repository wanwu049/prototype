<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>英圈刷题 - 设置页</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./nav.js" defer></script>
  </head>
  <body>
    <main class="stage">
      <section class="phone app" data-page="settings" aria-label="WeChat Mini Program Prototype">
        <header class="topbar app-header">
          <div class="status">
            <div class="status-left">10:01</div>
            <div class="status-right">
              <span class="pill">5G</span>
              <span class="pill">90%</span>
            </div>
          </div>
          <div class="brand">
            <a class="back-btn" href="./me.html" aria-label="返回我的">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
                <path
                  d="M15 6 9 12l6 6"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </a>
            <div class="brand-text">
              <div class="brand-title">设置</div>
              <div class="brand-subtitle">通知 · 隐私 · 缓存 · 关于我们</div>
            </div>
            <span style="width: 40px"></span>
          </div>
        </header>

        <section class="content app-content" aria-label="页面内容">
          <article class="card">
            <div class="card-hd">
              <div class="card-title">消息与通知</div>
              <div class="tags"><span class="tag ghost">占位开关</span></div>
            </div>
            <div class="list">
              <div class="list-item" role="listitem">
                <div class="li-main">系统通知</div>
                <div class="li-sub">活动提醒、公告、告警等</div>
              </div>
              <div class="list-item" role="listitem">
                <div class="li-main">问答互动</div>
                <div class="li-sub">评论回复、点赞、采纳提醒</div>
              </div>
              <div class="list-item" role="listitem">
                <div class="li-main">免打扰</div>
                <div class="li-sub">夜间自动静音（22:00-08:00）</div>
              </div>
            </div>
            <div class="detail-cta">
              <a class="mini-btn" href="./messages.html">去消息中心</a>
              <a class="ghost-btn" href="./messages-system-notice.html">查看通知</a>
            </div>
          </article>

          <article class="card">
            <div class="card-hd">
              <div class="card-title">隐私与权限</div>
              <div class="tags"><span class="tag ghost">数据</span></div>
            </div>
            <div class="list">
              <a class="list-item" href="./help.html">
                <div class="li-main">隐私政策</div>
                <div class="li-sub">数据收集、使用与保护说明</div>
              </a>
              <a class="list-item" href="./help.html">
                <div class="li-main">学习数据导出</div>
                <div class="li-sub">导出学习记录与错题（占位）</div>
              </a>
              <a class="list-item" href="./help.html">
                <div class="li-main">清除学习缓存</div>
                <div class="li-sub">释放空间、重建推荐（占位）</div>
              </a>
            </div>
          </article>

          <article class="card">
            <div class="card-hd">
              <div class="card-title">关于</div>
              <div class="tags"><span class="tag ghost">v0.1 Prototype</span></div>
            </div>
            <div class="para" style="margin-top: 0">
              英圈刷题：面向考试与日常提升的 AI 学习工具。支持刷题诊断、UGC 共创、语伴陪练与学习报告。
            </div>
            <div class="detail-cta">
              <a class="ghost-btn" href="./help.html">帮助与反馈</a>
              <a class="mini-btn" href="./welcome.html">查看欢迎页</a>
            </div>
          </article>
        </section>

        <footer class="nav app-footer" aria-label="底部导航">
          <a class="nav-item" href="./discover.html">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>首页</span>
          </a>
          <a class="nav-item" href="./practice-home.html">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>刷题</span>
          </a>
          <a class="nav-item" href="./community.html">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>社区</span>
          </a>
          <a class="nav-item" href="./mall.html">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>商城</span>
          </a>
          <a class="nav-item active" href="./me.html">
            <span class="nav-ic" aria-hidden="true"></span>
            <span>我的</span>
          </a>
        </footer>
      </section>
    </main>
  </body>
</html>
