<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>英圈刷题 - 支付页（交易服务）</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="./nav.js" defer></script>
  </head>
  <body>
    <main class="stage">
      <section class="phone app" data-page="pay" aria-label="WeChat Mini Program Prototype">
        <header class="topbar app-header">
          <div class="status">
            <div class="status-left">10:01</div>
            <div class="status-right"><span class="pill">5G</span><span class="pill">90%</span></div>
          </div>
          <div class="brand">
            <a class="back-btn" href="./order-confirm.html" aria-label="返回订单确认">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
                <path d="M15 6 9 12l6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </a>
            <div class="brand-text">
              <div class="brand-title">支付</div>
              <div class="brand-subtitle">第三方支付 · 查看支付状态</div>
            </div>
            <span style="width:40px"></span>
          </div>
        </header>

        <section class="content app-content" aria-label="页面内容">
          <article class="card">
            <div class="card-hd">
              <div class="card-title">订单信息</div>
              <div class="tags"><span class="tag ghost">订单号：20260417-001</span></div>
            </div>
            <div class="kv">
              <div class="k">支付方式</div>
              <div class="v">微信支付</div>
              <div class="k">应付金额</div>
              <div class="v"><span class="price red">¥44.8</span></div>
              <div class="k">状态</div>
              <div class="v"><span class="badge orange">待支付</span></div>
            </div>
            <div class="divider"></div>
            <div class="cover" aria-hidden="true" style="height:160px"></div>
            <div class="para muted" style="margin-top:10px">
              占位：此处可展示支付二维码/拉起支付按钮。完成后将自动更新订单状态并开通课程/会员权限。
            </div>
            <div class="row" style="margin-top:12px">
              <a class="mini-btn" href="./orders.html">查看订单</a>
              <a class="mini-btn primary" href="./orders.html">我已完成支付</a>
            </div>
          </article>

          <article class="card">
            <div class="card-hd">
              <div class="card-title">常见问题</div>
              <div class="tags"><span class="tag ghost">支付异常</span></div>
            </div>
            <div class="para">
              - 支付成功未开通：稍等 1 分钟后刷新订单；<br />
              - 重复扣款：可在“退款售后”发起处理；<br />
              - 需要发票/凭证：在订单详情中下载。
            </div>
            <div class="row" style="margin-top:12px">
              <a class="mini-btn" href="./after-sales.html">退款售后</a>
              <a class="mini-btn" href="./orders.html">订单列表</a>
            </div>
          </article>
        </section>

        <footer class="nav app-footer" aria-label="底部导航">
          <a class="nav-item" href="./discover.html"><span class="nav-ic" aria-hidden="true"></span><span>首页</span></a>
          <a class="nav-item" href="./practice-home.html"><span class="nav-ic" aria-hidden="true"></span><span>刷题</span></a>
          <a class="nav-item" href="./community.html"><span class="nav-ic" aria-hidden="true"></span><span>社区</span></a>
          <a class="nav-item active" href="./mall.html"><span class="nav-ic" aria-hidden="true"></span><span>商城</span></a>
          <a class="nav-item" href="./me.html"><span class="nav-ic" aria-hidden="true"></span><span>我的</span></a>
        </footer>
      </section>
    </main>
  </body>
</html>
